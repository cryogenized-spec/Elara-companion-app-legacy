name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/**, refactor/**]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Memory scaling benchmark
        run: npm run benchmark:memory

      - name: Build
        run: npm run build

      - name: Production verification
        run: npm run verify:production
